name: iis

# 内网部署专用 compose:只使用已加载的镜像,不含 build 段。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iis}
      POSTGRES_DB: ${POSTGRES_DB:-iis}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: iis-backend:${TAG:-0.21.10}
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://iis:iis@db:5432/iis}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - backend_data:/app/data
      # 内网 CA 自签:将 CA 证书放到本目录 ./certs/ca.pem,取消下一行注释,
      # 并在 .env 中设置 OIDC_CA_CERT=/certs/ca.pem
      # - ./certs/ca.pem:/certs/ca.pem:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: iis-frontend:${TAG:-0.21.10}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  db_data:
