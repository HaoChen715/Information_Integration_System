name: iis

services:
  backend:
    image: iis-backend:${TAG:-0.9.0}
    build:
      context: ../..
      dockerfile: deploy/app/backend.Dockerfile
    env_file:
      - .env
    environment:
      # SQLite 落盘到数据卷,容器重建不丢数据
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - backend_data:/app/data
      # 内网 CA 自签:将 CA 证书放到本目录 ./certs/ca.pem,取消下一行注释,
      # 并在 .env 中设置 OIDC_CA_CERT=/certs/ca.pem
      # - ./certs/ca.pem:/certs/ca.pem:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: iis-frontend:${TAG:-0.9.0}
    build:
      context: ../..
      dockerfile: deploy/app/frontend.Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
